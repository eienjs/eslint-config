ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@antfu/install-pkg'
strictPeerDependencies: false
trustPolicyIgnoreAfter: 2880

update:
  ignoreDeps:
    - typescript@7

allowBuilds:
  esbuild: true

shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

catalogs:
  dev:
    '@commitlint/cli': ^21.2.2
    '@commitlint/config-conventional': ^21.2.2
    '@eslint/config-inspector': ^3.4.1
    '@types/node': ^24.13.4
    auto-changelog: ^2.6.1
    baseline-browser-mapping: ^2.11.23
    eslint-typegen: ^2.3.1
    husky: ^9.1.7
    pnpm-workspace-yaml: ^1.9.1
    release-it: ^21.0.3
    tsdown: ^0.23.0
    tsx: ^4.23.13
    typescript: ^6.0.3
  inline:
    find-up-simple: ^1.0.1
  peer:
    '@adonisjs/eslint-plugin': ^2.2.2
    '@eslint-community/eslint-utils': ^4.10.1
    '@nuxt/eslint-plugin': ^1.17.0
    '@prettier/plugin-xml': ^3.4.2
    '@typescript-eslint/types': ^8.70.0
    '@typescript-eslint/utils': ^8.70.0
    astro-eslint-parser: ^3.1.0
    eslint: ^10.10.0
    eslint-plugin-astro: ^3.1.0
    eslint-plugin-erasable-syntax-only: ^0.7.1
    eslint-plugin-format: ^2.0.1
    prettier-plugin-astro: ^1.0.0
  prod:
    '@antfu/install-pkg': ^2.1.0
    '@clack/prompts': ^1.8.1
    '@e18e/eslint-plugin': ^0.8.0
    '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
    '@eslint/markdown': ^8.0.3
    '@stylistic/eslint-plugin': ^5.10.0
    '@typescript-eslint/eslint-plugin': ^8.70.0
    '@typescript-eslint/parser': ^8.70.0
    '@vitest/eslint-plugin': ^1.6.27
    ansis: ^4.4.0
    cac: ^7.0.0
    eslint-config-flat-gitignore: ^2.4.0
    eslint-flat-config-utils: ^3.2.0
    eslint-merge-processors: ^2.0.0
    eslint-plugin-antfu: ^3.2.3
    eslint-plugin-command: ^4.0.0
    eslint-plugin-import-lite: ^0.6.0
    eslint-plugin-jsdoc: ^64.4.0
    eslint-plugin-jsonc: ^3.4.2
    eslint-plugin-n: ^18.3.0
    eslint-plugin-no-only-tests: ^3.4.0
    eslint-plugin-perfectionist: ^5.11.0
    eslint-plugin-pnpm: ^1.9.1
    eslint-plugin-regexp: ^3.3.0
    eslint-plugin-toml: ^1.5.0
    eslint-plugin-unicorn: ^74.0.0
    eslint-plugin-unused-imports: ^4.4.1
    eslint-plugin-vue: ^10.11.0
    eslint-plugin-yml: ^3.8.1
    eslint-processor-vue-blocks: ^2.0.0
    globals: ^17.12.0
    local-pkg: ^1.2.1
    parse-gitignore: ^2.0.0
    pathe: ^2.0.3
    toml-eslint-parser: ^1.0.3
    vue-eslint-parser: ^10.4.1
    yaml-eslint-parser: ^2.1.0
